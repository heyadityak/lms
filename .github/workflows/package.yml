name: package

# CI (reusable call) -> compose smoke -> build + push ghcr.io/<owner>/<repo>/{app,nginx,web} (D-25, D-38, D-43).
# workflow_call instead of workflow_run: the run keeps the real push ref, so tags get semver images natively
# and the gate needs no head_sha/conclusion plumbing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a publish half-way; queue pushes to the same ref so "latest" lands in order.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  smoke:
    needs: ci
    runs-on: ubuntu-latest
    # Compose build plus Chromium install and the e2e suite no longer fit in 20 minutes.
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare .env
        # Dev image maps its user to the runner user so the bind-mounted checkout stays writable.
        run: |
          cp .env.example .env
          printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" >> .env
      - run: docker compose build
      - run: docker compose run --rm --no-deps app composer install --no-interaction --no-progress --prefer-dist
      - run: docker compose run --rm --no-deps app php artisan key:generate
      - run: docker compose up -d --wait --wait-timeout 300 --scale app=2 --scale web=2
      - run: docker compose run --rm migrate
      - run: docker compose run --rm app php artisan db:seed --class=DemoSeeder --force
      - run: docker compose run --rm web-migrate
      - name: Health checks
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/readyz
          curl -fsS -o /dev/null -w 'keycloak discovery %{http_code}\n' \
            http://localhost:8081/realms/lms/.well-known/openid-configuration
      - name: Edge routing
        run: |
          expect() { # expect <status> <path> [redirect]
            got=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "http://localhost:8080$2")
            echo "$2 -> $got"
            [ "$got" = "$1 ${3:-}" ] || { echo "::error::$2 expected $1 ${3:-}, got $got"; exit 1; }
          }
          expect 307 / http://localhost:8080/signin
          expect 200 /signin
          expect 200 /bff/healthz
          expect 200 /api/v1/branding
          expect 401 /api/v1/me
      - name: Keycloak login through nginx (alice)
        run: scripts/smoke-login.sh alice
      # Playwright on the runner, against compose nginx at localhost:8080.
      # QA owns web/e2e/playwright.config.ts and must read PLAYWRIGHT_BASE_URL for use.baseURL.
      # @playwright/test must be a direct web/ devDependency so npm ci provides the CLI.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: npx playwright test --config=e2e/playwright.config.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
      - name: Dump logs
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  push:
    needs: [ci, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: app
            target: app-prod
          - image: nginx
            target: nginx
          - image: web
            context: web
            target: runtime
    steps:
      - uses: actions/checkout@v7
      - id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=lms-${{ matrix.image }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=White-label Leave Management System (${{ matrix.image }})
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context || '.' }}
          target: ${{ matrix.target }}
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
