name: package

# CI (reusable call) -> compose smoke -> build + push ghcr.io/<owner>/<repo>/{app,nginx} (D-25, D-38).
# workflow_call instead of workflow_run: the run keeps the real push ref, so tags get semver images natively
# and the gate needs no head_sha/conclusion plumbing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a publish half-way; queue pushes to the same ref so "latest" lands in order.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  smoke:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Prepare .env
        # Dev image maps its user to the runner user so the bind-mounted checkout stays writable.
        run: |
          cp .env.example .env
          printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" >> .env
      - run: docker compose build
      - run: docker compose run --rm --no-deps app composer install --no-interaction --no-progress --prefer-dist
      - run: docker compose run --rm --no-deps app php artisan key:generate
      - run: docker compose up -d --wait --wait-timeout 300 --scale app=2
      - run: docker compose run --rm migrate
      - name: Health checks
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/readyz
          curl -fsS -o /dev/null -w 'keycloak discovery %{http_code}\n' \
            http://localhost:8081/realms/lms/.well-known/openid-configuration
      - name: Dump logs
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  push:
    needs: [ci, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: app
            target: app-prod
          - image: nginx
            target: nginx
    steps:
      - uses: actions/checkout@v7
      - id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=lms-${{ matrix.image }}
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
