name: wiki

# Mirrors docs/ (+ AGENTS.md) to the GitHub wiki. docs/ is the source of truth.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "scripts/docs-to-wiki.sh"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki

      - name: Generate pages
        run: scripts/docs-to-wiki.sh docs wiki

      - name: Commit and push if changed
        working-directory: wiki
        run: |
          git add -A .
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          # Wiki default branch is master; push whatever branch was cloned.
          git push origin HEAD
