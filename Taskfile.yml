# Short wrappers around docker compose (host has no PHP). Install Task: https://taskfile.dev/installation/
version: '3'

env:
  # Dev image maps the container user to the host user so bind-mounted files stay writable.
  UID: {sh: id -u}
  GID: {sh: id -g}

vars:
  RUN: docker compose run --rm app
  WEB: docker compose run --rm web-dev

tasks:
  up:
    desc: Start the dev stack in the background (first time, or after new migrations, run `task migrate`)
    cmds: [docker compose up -d]

  down:
    desc: Stop and remove the dev stack (volumes kept)
    cmds: [docker compose down]

  build:
    desc: Build all compose images
    cmds: [docker compose build]

  test:
    desc: Run all test suites (Unit + Feature on Postgres/Redis); the known-bug group is excluded (phpunit.xml)
    cmds:
      - '{{.RUN}} php artisan test {{.CLI_ARGS}}'
      - 'echo "Excluded known-bug tests: $(grep -rho "#\[Group(.known-bug.)\]" tests | wc -l | tr -d " ") (run: task test:known-bugs)"'

  test:known-bugs:
    desc: Run only the tests that document open bugs (expected to fail)
    cmds: ['{{.RUN}} php artisan test --group=known-bug {{.CLI_ARGS}}']

  test:unit:
    desc: Run the Unit suite
    cmds: ['{{.RUN}} php artisan test --testsuite=Unit {{.CLI_ARGS}}']

  test:feature:
    desc: Run the Feature suite
    cmds: ['{{.RUN}} php artisan test --testsuite=Feature {{.CLI_ARGS}}']

  lint:
    desc: Check code style with Pint
    cmds: ['{{.RUN}} vendor/bin/pint --test']

  migrate:
    desc: Run Laravel and Better Auth (lms_auth) migrations as one-off jobs
    cmds:
      - docker compose run --rm migrate
      - docker compose run --rm web-migrate

  reload:
    desc: Pick up PHP code changes in dev (restart Octane workers on every app replica; queue workers restart after their job)
    cmds:
      - for c in $(docker compose ps -q app); do docker exec "$c" curl -fsS -X POST http://localhost:2019/frankenphp/workers/restart; done
      - docker compose exec app php artisan queue:restart

  web:install:
    desc: Install web/ node_modules into the web-dev volume (once, and after package-lock changes)
    cmds: ['{{.WEB}} npm ci']

  web:test:
    desc: 'web/ checks: ESLint + Prettier, tsc, Vitest, generated API types fresh'
    cmds: ['{{.WEB}} sh -c "npm run lint && npm run typecheck && npm test && npm run check:api"']

  web:build:
    desc: next build (standalone) in the web-dev container
    cmds: ['{{.WEB}} npm run build']

  web:gen-api:
    desc: Regenerate web/src/lib/api/schema.d.ts from docs/api/openapi.yaml
    cmds: ['{{.WEB}} npm run gen:api']

  shell:
    desc: Open a shell in a one-off app container
    interactive: true
    cmds: ['{{.RUN}} sh']

  logs:
    desc: Follow app, web and worker logs
    cmds: [docker compose logs -f app web worker]
