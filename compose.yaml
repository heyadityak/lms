# Dev stack (SYSTEM_DESIGN §3). Scale: docker compose up -d --scale app=3 --scale worker=2
# One-off migrations (never in the entrypoint, D-24): docker compose run --rm migrate
x-app: &app
  build:
    context: .
    target: app-dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: lms-app-dev
  # No env_file: Laravel reads the bind-mounted .env itself, so phpunit.xml can override it
  # (real env vars beat phpunit's <env>). Only process-level knobs are passed here. Prod injects real env.
  environment:
    APP_SERVER_MODE: ${APP_SERVER_MODE:-octane}
    OCTANE_WORKERS: ${OCTANE_WORKERS:-auto}
    OCTANE_MAX_REQUESTS: ${OCTANE_MAX_REQUESTS:-500}
  volumes:
    - ./:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    s3-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  nginx:
    build:
      context: .
      target: nginx
    image: lms-nginx-dev
    environment:
      APP_UPSTREAM: ${APP_UPSTREAM:-app:8000}
      NGINX_RESOLVER: ${NGINX_RESOLVER:-127.0.0.11}
    volumes:
      # Dev: live static assets (the image bakes in a copy for prod).
      - ./public:/usr/share/nginx/html:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  app:
    <<: *app

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--backoff=10", "--max-time=3600"]
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  # One-off admin process (12-factor XII); only started by `docker compose run --rm migrate`.
  migrate:
    <<: *app
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"
    healthcheck:
      disable: true
    profiles: [tools]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-lms}
      POSTGRES_USER: ${DB_USERNAME:-lms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # S3-compatible object store (dev parity for FILESYSTEM_DISK/BRANDING_DISK=s3, D-24)
  rustfs:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-lmsdev}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-lmsdevsecret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - s3data:/data
    ports:
      - "${S3_FORWARD_PORT:-9000}:9000"
      - "${S3_CONSOLE_FORWARD_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Idempotent bucket bootstrap; prod buckets come from IaC.
  s3-init:
    image: amazon/aws-cli:2.41.1
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-lmsdev}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-lmsdevsecret}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      BUCKET: ${AWS_BUCKET:-lms}
    entrypoint: ["sh", "-c"]
    command:
      - aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$BUCKET"
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  # Upstream Keycloak, no custom image (D-33). Dev: start-dev + realm import (DEV ONLY users).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USERNAME:-lms}
      KC_DB_PASSWORD: ${DB_PASSWORD:-secret}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./docker/keycloak/realm-lms.json:/opt/keycloak/data/import/realm-lms.json:ro
    ports:
      - "${KEYCLOAK_FORWARD_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Image has no curl/wget; bash /dev/tcp against the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "${MAILPIT_UI_FORWARD_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_FORWARD_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  s3data:
