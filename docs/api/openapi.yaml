        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/IdpUnavailable'}

  /admin/users/{userId}/disable:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Identity admin]
      operationId: adminDisableUser
      summary: Disable in Keycloak, log out all sessions, deactivate locally
      description: Guardrails - not yourself (403 `SELF_MODIFICATION_FORBIDDEN`), not the last active admin (409 `LAST_ADMIN`).
      x-roles: [admin]
      x-module: user_management
      responses:
        '200': {$ref: '#/components/responses/IdentityUserOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/IdpUnavailable'}

  /admin/users/{userId}/roles:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Identity admin]
      operationId: adminSetUserRoles
      summary: Replace the user's LMS realm roles
      description: |
        Allow-list `employee`, `manager`, `hr_admin`, `admin`: exactly one base role plus
        optionally `admin`. Other realm roles are untouched. Guardrails - no change to your own
        roles (403 `SELF_MODIFICATION_FORBIDDEN`), the last active admin cannot lose `admin`
