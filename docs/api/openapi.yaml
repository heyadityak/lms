openapi: 3.1.0
info:
  title: Leave Management System API
  version: 1.0.0
  summary: White-label, single-tenant leave management REST API.
  description: |
    Contract-first API (decision D-21). **This file is the source of truth**; see
    `docs/API_GUIDELINES.md` for conventions.

    * Every `/api/v1` operation requires the `api` module (404 problem when off).
    * Authentication: Keycloak OIDC Bearer JWT (decision D-20). Tokens are obtained
      from Keycloak (client `lms-api-cli`, auth code + PKCE), never from this API.
    * `x-roles` lists the Keycloak realm roles allowed to call an operation at all.
      Every user holds exactly one base role (`employee`, `manager`, `hr_admin`); the
      `admin` realm role (branding, modules, identity admin) is additive (D-29).
      Resource-level rules (direct manager, not own request) are Laravel Policies and
      yield 403.
    * Envelope `{data, meta, links}`; errors are RFC 9457 `application/problem+json`
      with a stable `code`.
    * All ids are ULIDs (`public_id` column). Dates are ISO-8601.
    * `x-module` marks operations that also need a feature module (`holidays`, `reports`,
      `user_management`). `/admin/users` writes to Keycloak through its Admin API (D-22).
  contact:
    name: LMS architecture
  license:
    name: MIT
    identifier: MIT
servers:
  - url: '{baseUrl}/api/v1'
    description: One deployment per customer.
    variables:
      baseUrl:
        default: http://localhost:8080
        description: The deployment's APP_URL.
security:
  - keycloak: []
tags:
  - name: Me
    description: The authenticated caller.
  - name: Leave requests
    description: Apply, view and transition leave requests.
  - name: Approvals
    description: Manager / HR approval inbox and decisions.
  - name: Leave types
    description: Leave type catalogue (CL, SL, EL, LWP, ...).
  - name: Holidays
    description: Requires the `holidays` module.
  - name: Users
    description: LMS-owned user fields (department, manager, joining date, active flag).
  - name: Identity admin
    description: Keycloak-backed user administration, role `admin`. Requires the `user_management` module (D-22, D-29).
  - name: Balances
    description: Ledger-derived balances and ledger history.
  - name: Departments
    description: Organisational departments.
  - name: Settings
    description: Branding and modules (white-label, role `admin`); working week (role `hr_admin`, D-30).
  - name: Reports
    description: Requires the `reports` module.
  - name: Health
    description: Outside `/api/v1`, no authentication, no envelope.

paths:
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Current user
      x-roles: [employee, manager, hr_admin]
      responses:
        '200':
          description: The caller.
          headers:
            X-RateLimit-Limit: {$ref: '#/components/headers/X-RateLimit-Limit'}
            X-RateLimit-Remaining: {$ref: '#/components/headers/X-RateLimit-Remaining'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserEnvelope'}
              examples:
                alice: {$ref: '#/components/examples/UserAlice'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /me/balances:
    get:
      tags: [Me, Balances]
      operationId: listMyBalances
      summary: My balances per leave type for a leave year
      x-roles: [employee, manager, hr_admin]
      parameters:
        - $ref: '#/components/parameters/FilterYear'
      responses:
        '200': {$ref: '#/components/responses/BalanceList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /me/leave-requests:
    get:
      tags: [Me, Leave requests]
      operationId: listMyLeaveRequests
      summary: My leave requests
      x-roles: [employee, manager, hr_admin]
      parameters:
        - $ref: '#/components/parameters/FilterStatus'
        - $ref: '#/components/parameters/FilterYear'
        - $ref: '#/components/parameters/FilterFrom'
        - $ref: '#/components/parameters/FilterTo'
        - $ref: '#/components/parameters/SortLeaveRequests'
        - $ref: '#/components/parameters/IncludeLeaveRequest'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': {$ref: '#/components/responses/LeaveRequestList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /me/ledger-entries:
    get:
      tags: [Me, Balances]
      operationId: listMyLedgerEntries
      summary: My ledger entries (append-only balance history)
      x-roles: [employee, manager, hr_admin]
      parameters:
        - $ref: '#/components/parameters/FilterYear'
        - $ref: '#/components/parameters/FilterLeaveType'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': {$ref: '#/components/responses/LedgerEntryList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /leave-requests:
    get:
      tags: [Leave requests]
      operationId: listLeaveRequests
      summary: Leave requests visible to the caller
      description: Employee sees own; manager sees own and direct reports'; hr_admin sees all.
      x-roles: [employee, manager, hr_admin]
      parameters:
        - $ref: '#/components/parameters/FilterStatus'
        - $ref: '#/components/parameters/FilterYear'
        - $ref: '#/components/parameters/FilterFrom'
        - $ref: '#/components/parameters/FilterTo'
        - $ref: '#/components/parameters/FilterUser'
        - $ref: '#/components/parameters/FilterLeaveType'
        - $ref: '#/components/parameters/FilterDepartment'
        - $ref: '#/components/parameters/SortLeaveRequests'
        - $ref: '#/components/parameters/IncludeLeaveRequest'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': {$ref: '#/components/responses/LeaveRequestList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: [Leave requests]
      operationId: createLeaveRequest
      summary: Apply for leave
      description: |
        Runs validation V1–V9 (USE_CASES §3.4). `days` is computed by the server.
        Supports `Idempotency-Key` (Redis, 24 h): a retry with the same key and body
        replays the original response with `Idempotent-Replayed: true`.
      x-roles: [employee, manager, hr_admin]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeaveRequestCreate'}
            examples:
                earnedLeave: {$ref: '#/components/examples/LeaveRequestCreateEL'}
      responses:
        '201':
          description: Created, status `pending`.
          headers:
            Location:
              description: URL of the new request.
              schema: {type: string, format: uri}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
            X-RateLimit-Limit: {$ref: '#/components/headers/X-RateLimit-Limit'}
            X-RateLimit-Remaining: {$ref: '#/components/headers/X-RateLimit-Remaining'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaveRequestEnvelope'}
              examples:
                pending: {$ref: '#/components/examples/LeaveRequestPending'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/LeaveRuleViolation'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /leave-requests/{leaveRequestId}:
    parameters:
      - $ref: '#/components/parameters/LeaveRequestId'
    get:
      tags: [Leave requests]
      operationId: getLeaveRequest
      summary: Leave request detail
      x-roles: [employee, manager, hr_admin]
      parameters:
        - $ref: '#/components/parameters/IncludeLeaveRequest'
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaveRequestEnvelope'}
              examples:
                approvedWithActions: {$ref: '#/components/examples/LeaveRequestApproved'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /leave-requests/{leaveRequestId}/approve:
    parameters:
      - $ref: '#/components/parameters/LeaveRequestId'
    post:
      tags: [Leave requests, Approvals]
      operationId: approveLeaveRequest
      summary: Approve a pending request
      description: Re-checks overlap and balance, writes a `debit` ledger entry when the type tracks balance.
      x-roles: [manager, hr_admin]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecisionComment'}
      responses:
        '200': {$ref: '#/components/responses/LeaveRequestOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/LeaveRuleViolation'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /leave-requests/{leaveRequestId}/reject:
    parameters:
      - $ref: '#/components/parameters/LeaveRequestId'
    post:
      tags: [Leave requests, Approvals]
      operationId: rejectLeaveRequest
      summary: Reject a pending request (comment required)
      x-roles: [manager, hr_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RejectComment'}
      responses:
        '200': {$ref: '#/components/responses/LeaveRequestOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /leave-requests/{leaveRequestId}/cancel:
    parameters:
      - $ref: '#/components/parameters/LeaveRequestId'
    post:
      tags: [Leave requests]
      operationId: cancelLeaveRequest
      summary: Cancel a request
      description: |
        Owner: pending, or approved with `start_date` after today. hr_admin: any pending/approved
        request except their own started leave. Cancelling an approved request writes a
        `reversal` ledger entry for the full amount.
      x-roles: [employee, manager, hr_admin]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecisionComment'}
      responses:
        '200': {$ref: '#/components/responses/LeaveRequestOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: Approval inbox
      description: Requests the caller may decide (direct reports; any for hr_admin, never own).
      x-roles: [manager, hr_admin]
      parameters:
        - name: filter[status]
          in: query
          required: false
          schema:
            type: string
            enum: [pending]
            default: pending
        - $ref: '#/components/parameters/FilterDepartment'
        - $ref: '#/components/parameters/SortLeaveRequests'
        - $ref: '#/components/parameters/IncludeLeaveRequest'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': {$ref: '#/components/responses/LeaveRequestList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /leave-types:
    get:
      tags: [Leave types]
      operationId: listLeaveTypes
      summary: Leave types
      description: Active types for everyone; hr_admin may pass `filter[is_active]=false`.
      x-roles: [employee, manager, hr_admin]
      parameters:
        - name: filter[is_active]
          in: query
          required: false
          schema: {type: boolean, default: true}
      responses:
        '200':
          description: All matching types (not paginated; small set).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, links]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/LeaveType'}
                  meta: {type: object}
                  links: {type: object}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: [Leave types]
      operationId: createLeaveType
      summary: Create a leave type
      x-roles: [hr_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeaveTypeCreate'}
      responses:
        '201': {$ref: '#/components/responses/LeaveTypeCreated'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /leave-types/{leaveTypeId}:
    parameters:
      - $ref: '#/components/parameters/LeaveTypeId'
    get:
      tags: [Leave types]
      operationId: getLeaveType
      summary: Leave type detail
      x-roles: [employee, manager, hr_admin]
      responses:
        '200': {$ref: '#/components/responses/LeaveTypeOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    patch:
      tags: [Leave types]
      operationId: updateLeaveType
      summary: Update a leave type (code is immutable)
      x-roles: [hr_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeaveTypeUpdate'}
      responses:
        '200': {$ref: '#/components/responses/LeaveTypeOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /holidays:
    get:
      tags: [Holidays]
      operationId: listHolidays
      summary: Holidays of a leave year
      x-roles: [employee, manager, hr_admin]
      x-module: holidays
      parameters:
        - $ref: '#/components/parameters/FilterYear'
      responses:
        '200':
          description: Holidays ordered by date (not paginated).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, links]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Holiday'}
                  meta: {type: object}
                  links: {type: object}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: [Holidays]
      operationId: createHoliday
      summary: Create a holiday
      x-roles: [hr_admin]
      x-module: holidays
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HolidayWrite'}
      responses:
        '201': {$ref: '#/components/responses/HolidayCreated'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /holidays/{holidayId}:
    parameters:
      - $ref: '#/components/parameters/HolidayId'
    get:
      tags: [Holidays]
      operationId: getHoliday
      summary: Holiday detail
      x-roles: [employee, manager, hr_admin]
      x-module: holidays
      responses:
        '200': {$ref: '#/components/responses/HolidayOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    patch:
      tags: [Holidays]
      operationId: updateHoliday
      summary: Update a holiday
      x-roles: [hr_admin]
      x-module: holidays
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HolidayWrite'}
      responses:
        '200': {$ref: '#/components/responses/HolidayOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    delete:
      tags: [Holidays]
      operationId: deleteHoliday
      summary: Delete a holiday
      x-roles: [hr_admin]
      x-module: holidays
      responses:
        '204': {description: Deleted.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Users
      description: hr_admin sees all users; manager sees their direct reports.
      x-roles: [manager, hr_admin]
      parameters:
        - $ref: '#/components/parameters/FilterDepartment'
        - name: filter[is_active]
          in: query
          required: false
          schema: {type: boolean}
        - name: filter[role]
          in: query
          required: false
          schema: {$ref: '#/components/schemas/Role'}
        - name: filter[q]
          in: query
          required: false
          description: Case-insensitive match on name, email or employee code.
          schema: {type: string, maxLength: 100}
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, -name, date_of_joining, -date_of_joining, created_at, -created_at]
            default: name
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getUser
      summary: User detail
      x-roles: [manager, hr_admin]
      responses:
        '200': {$ref: '#/components/responses/UserOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update HR-owned user fields
      description: |
        Name, email and role come from Keycloak and are read-only here. Sending `role`
        yields 422 `ROLE_READ_ONLY`. Setting `date_of_joining` for the first time grants
        the prorated entitlement.
      x-roles: [hr_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdate'}
      responses:
        '200': {$ref: '#/components/responses/UserOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /users/{userId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      operationId: deactivateUser
      summary: Deactivate a user
      description: Refuses future logins/API calls, ends sessions, cancels pending requests.
      x-roles: [hr_admin]
      responses:
        '200': {$ref: '#/components/responses/UserOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /users/{userId}/activate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      operationId: activateUser
      summary: Re-activate a user
      x-roles: [hr_admin]
      responses:
        '200': {$ref: '#/components/responses/UserOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /users/{userId}/balances:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Balances, Users]
      operationId: listUserBalances
      summary: A user's balances
      description: Allowed for the user, their direct manager and hr_admin.
      x-roles: [employee, manager, hr_admin]
      parameters:
        - $ref: '#/components/parameters/FilterYear'
      responses:
        '200': {$ref: '#/components/responses/BalanceList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /users/{userId}/ledger-entries:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Balances, Users]
      operationId: listUserLedgerEntries
      summary: A user's ledger entries
      x-roles: [employee, manager, hr_admin]
      parameters:
        - $ref: '#/components/parameters/FilterYear'
        - $ref: '#/components/parameters/FilterLeaveType'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': {$ref: '#/components/responses/LedgerEntryList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: [Balances, Users]
      operationId: createBalanceAdjustment
      summary: Manual balance adjustment
      description: Appends an `adjustment` ledger entry. Ledger entries are never updated or deleted.
      x-roles: [hr_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdjustmentCreate'}
      responses:
        '201':
          description: Created.
          headers:
            Location:
              description: URL of the user's ledger.
              schema: {type: string, format: uri}
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, links]
                properties:
                  data: {$ref: '#/components/schemas/LedgerEntry'}
                  meta: {type: object}
                  links: {type: object}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /admin/users:
    get:
      tags: [Identity admin]
      operationId: adminListUsers
      summary: List / search identity users (Keycloak + local mirror)
      description: |
        Searches Keycloak (`search`, `first`, `max`) and merges LMS fields from the local mirror.
        Keycloak users without a local row get a mirror row on the fly, so every item has a ULID.
        No stale local fallback: if Keycloak is unavailable this (and every `/admin/users`
        operation) returns 503 `IDP_UNAVAILABLE` (D-32).
      x-roles: [admin]
      x-module: user_management
      parameters:
        - name: filter[q]
          in: query
          required: false
          description: Matches username, email, first or last name (Keycloak search).
          schema: {type: string, maxLength: 100}
        - name: filter[enabled]
          in: query
          required: false
          schema: {type: boolean}
        - name: filter[role]
          in: query
          required: false
          schema: {$ref: '#/components/schemas/AssignableRole'}
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of identity users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/IdentityUser'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/IdpUnavailable'}
    post:
      tags: [Identity admin]
      operationId: adminCreateUser
      summary: Create a user in Keycloak and the LMS
      description: |
        Keycloak first (no password; `execute-actions-email` with `UPDATE_PASSWORD` and
        `VERIFY_EMAIL` is sent after commit), then the local row with `keycloak_sub`. If the
        local write fails the Keycloak user is deleted (compensation). Audited in
        `user_admin_audits`. Supports `Idempotency-Key` (Redis, 24 h).
      x-roles: [admin]
      x-module: user_management
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityUserCreate'}
            examples:
              dave: {$ref: '#/components/examples/IdentityUserCreateDave'}
      responses:
        '201':
          description: Created.
          headers:
            Location:
              description: URL of the new user.
              schema: {type: string, format: uri}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityUserEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdpConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/IdpUnavailable'}

  /admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Identity admin]
      operationId: adminGetUser
      summary: Identity user detail
      x-roles: [admin]
      x-module: user_management
      responses:
        '200': {$ref: '#/components/responses/IdentityUserOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/IdpUnavailable'}
    patch:
      tags: [Identity admin]
      operationId: adminUpdateUser
      summary: Update profile (Keycloak) and LMS fields in one call
      description: Profile fields of federated users (`federated=true`) are read-only (422 `IDP_READ_ONLY`).
      x-roles: [admin]
      x-module: user_management
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityUserUpdate'}
      responses:
        '200': {$ref: '#/components/responses/IdentityUserOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdpConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/IdpUnavailable'}

  /admin/users/{userId}/enable:
