components:
  securitySchemes:
    keycloak:
      type: openIdConnect
      description: |
        Keycloak realm `lms` of the deployment. Public client `lms-api-cli` (auth code + PKCE S256).
        Access token must be RS256, `iss` = `{KEYCLOAK_PUBLIC_URL}/realms/lms`, `aud`/`azp` in `KEYCLOAK_ALLOWED_AUDIENCES`.
        Send as `Authorization: Bearer <token>`.
      openIdConnectUrl: http://localhost:8081/realms/lms/.well-known/openid-configuration

  headers:
    X-RateLimit-Limit:
      description: Requests allowed per window (Redis limiter).
      schema: {type: integer, example: 60}
    X-RateLimit-Remaining:
      description: Requests left in the current window.
      schema: {type: integer, example: 57}
    X-RateLimit-Reset:
      description: Unix time when the window resets.
      schema: {type: integer}
    Retry-After:
      description: Seconds to wait before retrying.
      schema: {type: integer, example: 30}
    Idempotent-Replayed:
      description: '`true` when the response was replayed from the idempotency store.'
      schema: {type: string, enum: ['true']}

  parameters:
    LeaveRequestId:
      name: leaveRequestId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    LeaveTypeId:
      name: leaveTypeId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    HolidayId:
      name: holidayId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    UserId:
      name: userId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    PageNumber:
      name: page[number]
      in: query
      required: false
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page[size]
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    FilterStatus:
      name: filter[status]
      in: query
      required: false
      description: Comma-separated statuses (OR).
      schema: {type: string, pattern: '^(pending|approved|rejected|cancelled)(,(pending|approved|rejected|cancelled))*$'}
      example: pending,approved
    FilterYear:
      name: filter[year]
      in: query
      required: false
      description: Leave year (labelled by the calendar year it starts in; see LEAVE_YEAR_START_MONTH). Default current leave year.
      schema: {type: integer, minimum: 2000, maximum: 2100}
    FilterFrom:
      name: filter[from]
      in: query
      required: false
      description: Requests ending on/after this date.
      schema: {type: string, format: date}
    FilterTo:
      name: filter[to]
      in: query
      required: false
      description: Requests starting on/before this date.
      schema: {type: string, format: date}
    FilterUser:
      name: filter[user]
      in: query
      required: false
      schema: {$ref: '#/components/schemas/Ulid'}
    FilterLeaveType:
      name: filter[leave_type]
      in: query
      required: false
      schema: {$ref: '#/components/schemas/Ulid'}
    FilterDepartment:
      name: filter[department]
      in: query
      required: false
      schema: {$ref: '#/components/schemas/Ulid'}
    SortLeaveRequests:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [start_date, -start_date, created_at, -created_at, days, -days]
        default: -start_date
    IncludeLeaveRequest:
      name: include
      in: query
      required: false
      description: Comma list of `actions`, `user`, `leave_type`.
      schema: {type: string, pattern: '^(actions|user|leave_type)(,(actions|user|leave_type))*$'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated unique key (UUID/ULID). Stored in Redis for 24 h per user.
      schema: {type: string, minLength: 8, maxLength: 255}
      example: 6c0d7c4e-2f5b-4a39-9a8f-3c1d2b7e9f10

  responses:
    Unauthenticated:
      description: Missing or invalid Bearer JWT, or user inactive / without an LMS role.
      headers:
        WWW-Authenticate:
          description: Bearer challenge.
          schema: {type: string, example: 'Bearer error="invalid_token"'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: urn:lms:problem:unauthenticated
            title: Unauthenticated
            status: 401
            detail: The access token has expired.
            instance: /api/v1/me
            code: UNAUTHENTICATED
            request_id: 6f1c0e9a8b7d4c3e
    Forbidden:
      description: A policy denies the action (`FORBIDDEN`, `SELF_MODIFICATION_FORBIDDEN`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: urn:lms:problem:forbidden
            title: Forbidden
            status: 403
            detail: You cannot approve your own leave request.
            instance: /api/v1/leave-requests/01JD3M7V1Q8Z6K2H5R9T4W0XYZ/approve
            code: FORBIDDEN
            request_id: 6f1c0e9a8b7d4c3e
    NotFound:
      description: Unknown or invisible resource, or the module (`api`, `holidays`, `reports`) is disabled.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: urn:lms:problem:not-found
            title: Not Found
            status: 404
            detail: The requested resource does not exist.
            instance: /api/v1/holidays
            code: NOT_FOUND
            request_id: 6f1c0e9a8b7d4c3e
    NotAcceptable:
      description: Unsupported `Accept`.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnsupportedMediaType:
      description: Unsupported `Content-Type`.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: State conflict (`INVALID_TRANSITION`, `IDEMPOTENCY_IN_PROGRESS`, `DEPARTMENT_NOT_EMPTY`, `LAST_ADMIN`).
      headers:
        Retry-After: {$ref: '#/components/headers/Retry-After'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            invalidTransition: {$ref: '#/components/examples/ProblemInvalidTransition'}
            idempotencyInProgress: {$ref: '#/components/examples/ProblemIdempotencyInProgress'}
    ValidationFailed:
      description: Validation failed.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ValidationProblem'}
          examples:
            validation: {$ref: '#/components/examples/ProblemValidation'}
    LeaveRuleViolation:
      description: Validation or a leave business rule (V1–V9) failed.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ValidationProblem'}
          examples:
            validation: {$ref: '#/components/examples/ProblemValidation'}
            overlap: {$ref: '#/components/examples/ProblemOverlap'}
            insufficientBalance: {$ref: '#/components/examples/ProblemInsufficientBalance'}
            idempotencyKeyReused: {$ref: '#/components/examples/ProblemIdempotencyKeyReused'}
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After: {$ref: '#/components/headers/Retry-After'}
        X-RateLimit-Limit: {$ref: '#/components/headers/X-RateLimit-Limit'}
        X-RateLimit-Remaining: {$ref: '#/components/headers/X-RateLimit-Remaining'}
        X-RateLimit-Reset: {$ref: '#/components/headers/X-RateLimit-Reset'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: urn:lms:problem:rate-limited
            title: Too Many Requests
            status: 429
            detail: Retry in 30 seconds.
            instance: /api/v1/leave-requests
            code: RATE_LIMITED
            request_id: 6f1c0e9a8b7d4c3e
    IdpConflict:
      description: Keycloak reported a duplicate username or email.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: urn:lms:problem:idp-conflict
            title: Identity provider conflict
            status: 409
            detail: A user with this email already exists in the identity provider.
            instance: /api/v1/admin/users
            code: IDP_CONFLICT
            request_id: 6f1c0e9a8b7d4c3e
    IdpUnavailable:
      description: Keycloak is unreachable, timed out or returned 5xx. Nothing was written locally.
      headers:
        Retry-After: {$ref: '#/components/headers/Retry-After'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: urn:lms:problem:idp-unavailable
            title: Identity provider unavailable
            status: 503
            detail: Keycloak did not respond in time. Try again later.
            instance: /api/v1/admin/users
            code: IDP_UNAVAILABLE
            request_id: 6f1c0e9a8b7d4c3e
    WorkingWeekOk:
      description: Effective working week.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta, links]
            properties:
              data: {$ref: '#/components/schemas/WorkingWeek'}
              meta: {type: object}
              links: {type: object}
    IdentityUserOk:
      description: Identity user.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/IdentityUserEnvelope'}
    LeaveRequestOk:
      description: The updated request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LeaveRequestEnvelope'}
    LeaveRequestList:
      description: Page of leave requests.
      headers:
        X-RateLimit-Limit: {$ref: '#/components/headers/X-RateLimit-Limit'}
        X-RateLimit-Remaining: {$ref: '#/components/headers/X-RateLimit-Remaining'}
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaginatedEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/LeaveRequest'}
    BalanceList:
      description: One row per tracked leave type.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta, links]
            properties:
              data:
                type: array
                items: {$ref: '#/components/schemas/Balance'}
              meta:
                type: object
                properties:
                  year: {type: integer}
                  leave_year_start: {type: string, format: date}
                  leave_year_end: {type: string, format: date}
              links: {type: object}
          examples:
            alice: {$ref: '#/components/examples/BalancesAlice'}
    LedgerEntryList:
      description: Page of ledger entries, oldest first.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaginatedEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/LedgerEntry'}
    LeaveTypeOk:
      description: Leave type.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta, links]
            properties:
              data: {$ref: '#/components/schemas/LeaveType'}
              meta: {type: object}
              links: {type: object}
    LeaveTypeCreated:
      description: Created.
      headers:
        Location:
          description: URL of the new resource.
          schema: {type: string, format: uri}
      content:
        application/json:
          schema:
            type: object
            required: [data, meta, links]
            properties:
              data: {$ref: '#/components/schemas/LeaveType'}
              meta: {type: object}
              links: {type: object}
    HolidayOk:
      description: Holiday.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta, links]
            properties:
              data: {$ref: '#/components/schemas/Holiday'}
              meta: {type: object}
              links: {type: object}
    HolidayCreated:
      description: Created.
      headers:
        Location:
          description: URL of the new resource.
          schema: {type: string, format: uri}
      content:
        application/json:
          schema:
            type: object
            required: [data, meta, links]
            properties:
              data: {$ref: '#/components/schemas/Holiday'}
              meta: {type: object}
              links: {type: object}
    DepartmentOk:
      description: Department.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta, links]
            properties:
              data: {$ref: '#/components/schemas/Department'}
              meta: {type: object}
              links: {type: object}
    DepartmentCreated:
      description: Created.
      headers:
        Location:
          description: URL of the new resource.
          schema: {type: string, format: uri}
      content:
        application/json:
          schema:
            type: object
            required: [data, meta, links]
            properties:
              data: {$ref: '#/components/schemas/Department'}
              meta: {type: object}
              links: {type: object}
    UserOk:
      description: User.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/UserEnvelope'}
    BrandingOk:
      description: Effective branding.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta, links]
            properties:
              data: {$ref: '#/components/schemas/Branding'}
              meta: {type: object}
              links: {type: object}
          examples:
            acme: {$ref: '#/components/examples/BrandingAcme'}

  schemas:
    Ulid:
      type: string
      description: ULID (Crockford base32), the row's `public_id`.
      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      examples: [01JD3M7V1Q8Z6K2H5R9T4W0XYZ]
    Days:
      type: number
      multipleOf: 0.5
      description: Day amount, always a multiple of 0.5.
    Role:
      type: string
      enum: [employee, manager, hr_admin]
      description: Base LMS realm role, exactly one per user (read-only outside `/admin/users/{id}/roles`).
    AssignableRole:
      type: string
      enum: [employee, manager, hr_admin, admin]
      description: Realm roles the LMS may assign/revoke (allow-list, D-29). `admin` is additive.
    LeaveStatus:
      type: string
      enum: [pending, approved, rejected, cancelled]
    DayPart:
      type: string
      enum: [full, first_half, second_half]
    LedgerKind:
      type: string
      enum: [grant, carry_forward, lapse, debit, reversal, adjustment]
    LeaveAction:
      type: string
      enum: [submitted, approved, rejected, cancelled]
    ModuleKey:
      type: string
      enum: [holidays, reports, api, notifications, user_management, multi_level_approval, delegation]
    HexColor:
      type: string
      pattern: '^#[0-9a-fA-F]{6}$'
      examples: ['#1f6feb']

    Links:
      type: object
      properties:
        first: {type: [string, 'null'], format: uri}
        prev: {type: [string, 'null'], format: uri}
        next: {type: [string, 'null'], format: uri}
        last: {type: [string, 'null'], format: uri}
    PageMeta:
      type: object
      required: [current_page, per_page, total, last_page]
      properties:
        current_page: {type: integer, minimum: 1}
        per_page: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
        last_page: {type: integer, minimum: 1}
    PaginatedEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data: {type: array}
        meta: {$ref: '#/components/schemas/PageMeta'}
        links: {$ref: '#/components/schemas/Links'}

    Problem:
      type: object
      description: RFC 9457 problem details with LMS extensions `code` and `request_id`.
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri-reference, examples: ['urn:lms:problem:leave-overlap']}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code: {$ref: '#/components/schemas/ProblemCode'}
        request_id: {type: string}
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: {type: string}
    ProblemCode:
      type: string
      description: Stable machine-readable error code. See API_GUIDELINES §4.
      enum:
        - BAD_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - NOT_ACCEPTABLE
        - INVALID_TRANSITION
        - IDEMPOTENCY_IN_PROGRESS
        - DEPARTMENT_NOT_EMPTY
        - UNSUPPORTED_MEDIA_TYPE
        - VALIDATION_FAILED
        - LEAVE_TYPE_INACTIVE
        - BACKDATE_LIMIT_EXCEEDED
        - INVALID_DATE_RANGE
        - HALF_DAY_NOT_ALLOWED
        - NO_WORKING_DAYS
        - LEAVE_OVERLAP
        - INSUFFICIENT_BALANCE
        - NO_APPROVER
        - COMMENT_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - MODULE_NOT_LICENSED
        - MANAGER_CYCLE
        - ROLE_READ_ONLY
        - SELF_MODIFICATION_FORBIDDEN
        - LAST_ADMIN
        - IDP_CONFLICT
        - IDP_READ_ONLY
        - IDP_UNAVAILABLE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE

    UserSummary:
      type: object
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        name: {type: string}
    DepartmentSummary:
      type: object
      required: [id, code, name]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        code: {type: string}
        name: {type: string}
    LeaveTypeSummary:
      type: object
      required: [id, code, name]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        code: {type: string}
        name: {type: string}

    User:
      type: object
      required: [id, name, email, role, is_admin, department, manager, employee_code, designation, employment_type, date_of_joining, is_active, last_login_at, created_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        name: {type: string, readOnly: true, description: From Keycloak.}
        email: {type: string, format: email, readOnly: true, description: From Keycloak.}
        role: {allOf: [{$ref: '#/components/schemas/Role'}], readOnly: true}
        is_admin: {type: boolean, readOnly: true, description: 'Holds the additive realm role `admin` (D-29).'}
        department:
          oneOf:
            - $ref: '#/components/schemas/DepartmentSummary'
            - type: 'null'
        manager:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        employee_code: {type: [string, 'null']}
        designation: {type: [string, 'null']}
        employment_type: {type: [string, 'null']}
        date_of_joining: {type: [string, 'null'], format: date}
        is_active: {type: boolean}
        last_login_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    UserEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data: {$ref: '#/components/schemas/User'}
        meta: {type: object}
        links: {type: object}
    UserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: HR-owned fields only. `role`, `name`, `email` are rejected (422 `ROLE_READ_ONLY` / `VALIDATION_FAILED`).
      properties:
        department_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}]}
        manager_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}]}
        date_of_joining: {type: string, format: date}
        employee_code: {type: [string, 'null'], maxLength: 50}
        designation: {type: [string, 'null'], maxLength: 100}
        employment_type: {type: [string, 'null'], maxLength: 50}

    Department:
      type: object
      required: [id, code, name, users_count]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        code: {type: string, maxLength: 20}
        name: {type: string, maxLength: 100}
        users_count: {type: integer, minimum: 0}
    DepartmentWrite:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: {type: string, maxLength: 20}
        name: {type: string, maxLength: 100}

    LeaveType:
      type: object
      required: [id, code, name, annual_quota, tracks_balance, carry_forward_cap, max_balance, allow_half_day, max_backdate_days, is_active]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        code: {type: string, maxLength: 10}
        name: {type: string, maxLength: 100}
        annual_quota: {$ref: '#/components/schemas/Days'}
        tracks_balance: {type: boolean}
        carry_forward_cap:
          description: null = carry everything, 0 = nothing carries.
          oneOf: [{$ref: '#/components/schemas/Days'}, {type: 'null'}]
        max_balance:
          description: null = no ceiling.
          oneOf: [{$ref: '#/components/schemas/Days'}, {type: 'null'}]
        allow_half_day: {type: boolean}
        max_backdate_days: {type: integer, minimum: 0}
        is_active: {type: boolean}
    LeaveTypeCreate:
      type: object
      additionalProperties: false
      required: [code, name, annual_quota, tracks_balance]
      properties:
        code: {type: string, pattern: '^[A-Z0-9_]{1,10}$'}
        name: {type: string, maxLength: 100}
        annual_quota: {$ref: '#/components/schemas/Days'}
        tracks_balance: {type: boolean}
        carry_forward_cap: {oneOf: [{$ref: '#/components/schemas/Days'}, {type: 'null'}]}
        max_balance: {oneOf: [{$ref: '#/components/schemas/Days'}, {type: 'null'}]}
        allow_half_day: {type: boolean, default: true}
        max_backdate_days: {type: integer, minimum: 0, default: 0}
    LeaveTypeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, maxLength: 100}
        annual_quota: {$ref: '#/components/schemas/Days'}
        tracks_balance: {type: boolean}
        carry_forward_cap: {oneOf: [{$ref: '#/components/schemas/Days'}, {type: 'null'}]}
        max_balance: {oneOf: [{$ref: '#/components/schemas/Days'}, {type: 'null'}]}
        allow_half_day: {type: boolean}
        max_backdate_days: {type: integer, minimum: 0}
        is_active: {type: boolean}

    Holiday:
      type: object
      required: [id, date, name]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        date: {type: string, format: date}
        name: {type: string, maxLength: 100}
    HolidayWrite:
      type: object
      additionalProperties: false
      required: [date, name]
      properties:
        date: {type: string, format: date}
        name: {type: string, maxLength: 100}

    LeaveRequestAction:
      type: object
      required: [id, action, from_status, to_status, comment, actor, created_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        action: {$ref: '#/components/schemas/LeaveAction'}
        from_status:
          oneOf: [{$ref: '#/components/schemas/LeaveStatus'}, {type: 'null'}]
        to_status: {$ref: '#/components/schemas/LeaveStatus'}
        comment: {type: [string, 'null']}
        actor: {$ref: '#/components/schemas/UserSummary'}
        created_at: {type: string, format: date-time}
    LeaveRequest:
      type: object
      required: [id, user, leave_type, start_date, end_date, day_part, days, status, reason, handover_note, leave_year, is_taken, decided_by, decided_at, decision_comment, cancelled_at, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        user: {$ref: '#/components/schemas/UserSummary'}
        leave_type: {$ref: '#/components/schemas/LeaveTypeSummary'}
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
        day_part: {$ref: '#/components/schemas/DayPart'}
        days: {$ref: '#/components/schemas/Days'}
        status: {$ref: '#/components/schemas/LeaveStatus'}
        reason: {type: string}
        handover_note: {type: [string, 'null']}
        leave_year: {type: integer}
        is_taken: {type: boolean, description: 'Derived: approved and start_date <= today.'}
        decided_by:
          oneOf: [{$ref: '#/components/schemas/UserSummary'}, {type: 'null'}]
        decided_at: {type: [string, 'null'], format: date-time}
        decision_comment: {type: [string, 'null']}
        cancelled_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        actions:
          type: array
          description: Present only with `include=actions`.
          items: {$ref: '#/components/schemas/LeaveRequestAction'}
    LeaveRequestEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data: {$ref: '#/components/schemas/LeaveRequest'}
        meta: {type: object}
        links:
          type: object
          properties:
            self: {type: string, format: uri}
    LeaveRequestCreate:
      type: object
      additionalProperties: false
      required: [leave_type_id, start_date, end_date, day_part, reason]
      properties:
        leave_type_id: {$ref: '#/components/schemas/Ulid'}
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
        day_part: {$ref: '#/components/schemas/DayPart'}
        reason: {type: string, minLength: 3, maxLength: 1000}
        handover_note: {type: [string, 'null'], maxLength: 2000}
    DecisionComment:
      type: object
      additionalProperties: false
      properties:
        comment: {type: [string, 'null'], maxLength: 1000}
    RejectComment:
      type: object
      additionalProperties: false
      required: [comment]
      properties:
        comment: {type: string, minLength: 3, maxLength: 1000}

    Balance:
      type: object
      description: |
        entitled = grant + carry_forward + lapse + adjustment; used = -(debit + reversal);
        balance = entitled - used = SUM(ledger); available = balance - pending.
      required: [leave_type, year, entitled, used, pending, balance, available]
      properties:
        leave_type: {$ref: '#/components/schemas/LeaveTypeSummary'}
        year: {type: integer}
        entitled: {type: number}
        used: {type: number}
        pending: {type: number}
        balance: {type: number}
        available: {type: number}
    LedgerEntry:
      type: object
      required: [id, leave_type, year, kind, days, leave_request_id, actor, note, created_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        leave_type: {$ref: '#/components/schemas/LeaveTypeSummary'}
        year: {type: integer}
        kind: {$ref: '#/components/schemas/LedgerKind'}
        days: {type: number, multipleOf: 0.5, description: Signed.}
        leave_request_id:
          oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}]
        actor:
          description: null = system (accrual job).
          oneOf: [{$ref: '#/components/schemas/UserSummary'}, {type: 'null'}]
        note: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    AdjustmentCreate:
      type: object
      additionalProperties: false
      required: [leave_type_id, days, note]
      properties:
        leave_type_id: {$ref: '#/components/schemas/Ulid'}
        year: {type: integer, description: Defaults to the current leave year.}
        days:
          type: number
          multipleOf: 0.5
          not: {const: 0}
          description: Signed, non-zero.
        note: {type: string, minLength: 3, maxLength: 255}

    Branding:
      type: object
      required: [name, primary_color, accent_color, primary_contrast, logo_url, favicon_url, overridden]
      properties:
        name: {type: string, maxLength: 60}
        primary_color: {$ref: '#/components/schemas/HexColor'}
        accent_color: {$ref: '#/components/schemas/HexColor'}
        primary_contrast: {$ref: '#/components/schemas/HexColor'}
        logo_url: {type: string, format: uri}
        favicon_url: {type: string, format: uri}
        overridden:
          type: array
          description: Setting keys that currently have a DB override.
          items:
            type: string
            enum: [brand.name, brand.primary_color, brand.accent_color, brand.logo_path, brand.favicon_path]
    BrandingUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 60}
        primary_color: {$ref: '#/components/schemas/HexColor'}
        accent_color: {$ref: '#/components/schemas/HexColor'}

    Module:
      type: object
      required: [key, label, licensed, available, enabled, locked]
      properties:
        key: {$ref: '#/components/schemas/ModuleKey'}
        label: {type: string}
        licensed: {type: boolean, description: In MODULES_ENABLED (env).}
        available: {type: boolean, description: Implemented (registry).}
        enabled: {type: boolean, description: licensed AND available AND not disabled by admin.}
        locked: {type: boolean, description: true when not licensed or not available (cannot be enabled).}

    LeaveRequestReportRow:
      type: object
      required: [request_id, employee_code, employee, department, leave_type, start_date, end_date, day_part, days, status, decided_by, decided_at]
      properties:
        request_id: {$ref: '#/components/schemas/Ulid'}
        employee_code: {type: [string, 'null']}
        employee: {type: string}
        department: {type: [string, 'null']}
        leave_type: {type: string}
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
        day_part: {$ref: '#/components/schemas/DayPart'}
        days: {$ref: '#/components/schemas/Days'}
        status: {$ref: '#/components/schemas/LeaveStatus'}
        decided_by: {type: [string, 'null']}
        decided_at: {type: [string, 'null'], format: date-time}
    BalanceReportRow:
      type: object
      required: [employee_code, employee, department, leave_type, year, entitled, used, pending, balance, available]
      properties:
        employee_code: {type: [string, 'null']}
        employee: {type: string}
        department: {type: [string, 'null']}
        leave_type: {type: string}
        year: {type: integer}
        entitled: {type: number}
        used: {type: number}
        pending: {type: number}
        balance: {type: number}
        available: {type: number}

    IdentityUser:
      type: object
      description: Keycloak identity merged with LMS fields.
      required: [id, keycloak_id, username, email, first_name, last_name, enabled, email_verified, role, is_admin, federated, federation_link, department, manager, date_of_joining, employee_code, designation, employment_type, is_active]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        keycloak_id: {type: string, format: uuid}
        username: {type: string}
        email: {type: [string, 'null'], format: email}
        first_name: {type: [string, 'null']}
        last_name: {type: [string, 'null']}
        enabled: {type: boolean, description: Keycloak enabled flag.}
        email_verified: {type: boolean}
        role:
          description: The LMS realm role, null if the user has none.
          oneOf: [{$ref: '#/components/schemas/Role'}, {type: 'null'}]
        is_admin: {type: boolean, description: 'Holds the realm role `admin`.'}
        federated: {type: boolean, description: 'true when the user comes from LDAP/AD (profile read-only).'}
        federation_link: {type: [string, 'null']}
        department:
          oneOf: [{$ref: '#/components/schemas/DepartmentSummary'}, {type: 'null'}]
        manager:
          oneOf: [{$ref: '#/components/schemas/UserSummary'}, {type: 'null'}]
        date_of_joining: {type: [string, 'null'], format: date}
        employee_code: {type: [string, 'null']}
        designation: {type: [string, 'null']}
        employment_type: {type: [string, 'null']}
        is_active: {type: boolean, description: Local LMS flag.}
    IdentityUserEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data: {$ref: '#/components/schemas/IdentityUser'}
        meta: {type: object}
        links: {type: object}
    IdentityUserCreate:
      type: object
      additionalProperties: false
      required: [username, email, first_name, last_name]
      properties:
        username: {type: string, pattern: '^[a-z0-9._-]{3,64}$'}
        email: {type: string, format: email, maxLength: 255}
        first_name: {type: string, minLength: 1, maxLength: 100}
        last_name: {type: string, minLength: 1, maxLength: 100}
        enabled: {type: boolean, default: true}
        role: {allOf: [{$ref: '#/components/schemas/Role'}], default: employee}
        is_admin: {type: boolean, default: false, description: 'Also grant the realm role `admin`.'}
        department_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}]}
        manager_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}]}
        date_of_joining: {type: [string, 'null'], format: date}
        employee_code: {type: [string, 'null'], maxLength: 50}
        designation: {type: [string, 'null'], maxLength: 100}
        employment_type: {type: [string, 'null'], maxLength: 50}
    IdentityUserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Profile fields go to Keycloak; the rest are LMS fields. Use `/roles`, `/enable`, `/disable` for those.
      properties:
        email: {type: string, format: email, maxLength: 255}
        first_name: {type: string, minLength: 1, maxLength: 100}
        last_name: {type: string, minLength: 1, maxLength: 100}
        department_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}]}
        manager_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}]}
        date_of_joining: {type: [string, 'null'], format: date}
        employee_code: {type: [string, 'null'], maxLength: 50}
        designation: {type: [string, 'null'], maxLength: 100}
        employment_type: {type: [string, 'null'], maxLength: 50}
    RoleAssignment:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: Exactly one base role (`employee`, `manager`, `hr_admin`) plus optionally `admin`. Omitting `admin` revokes it.
          items: {$ref: '#/components/schemas/AssignableRole'}

    WorkingWeek:
      type: object
      required: [weekend_days, overridden]
      properties:
        weekend_days:
          type: array
          description: Effective ISO weekdays that are not working days (1 = Monday ... 7 = Sunday).
          items: {type: integer, minimum: 1, maximum: 7}
          uniqueItems: true
          maxItems: 6
        overridden: {type: boolean, description: 'true when the `work.weekend_days` setting overrides `LMS_WEEKEND_DAYS`.'}
    WorkingWeekUpdate:
      type: object
      additionalProperties: false
      required: [weekend_days]
      properties:
        weekend_days:
          description: Unique ISO weekdays 1-7, at least one working day left; `null` resets to the env default.
          oneOf:
            - type: array
              items: {type: integer, minimum: 1, maximum: 7}
              uniqueItems: true
              maxItems: 6
            - type: 'null'

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: {type: string, enum: [ready, unavailable]}
        checks:
          type: object
          required: [db, redis]
          properties:
            db: {type: string, enum: [ok, fail]}
            redis: {type: string, enum: [ok, fail]}

